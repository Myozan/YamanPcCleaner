name: .NET Framework build and release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Windows .NET Framework compiler
        shell: cmd
        run: call derle.cmd

      - name: Generate SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\YamanPcCleaner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  YamanPcCleaner.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Yaman PC Cleaner ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            YamanPcCleaner.exe
            SHA256SUMS.txt

      - name: Upload executable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YamanPcCleaner-build
          path: YamanPcCleaner.exe
          if-no-files-found: error
          retention-days: 7
