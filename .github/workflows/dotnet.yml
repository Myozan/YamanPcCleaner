name: .NET Framework build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Windows .NET Framework compiler
        shell: cmd
        run: call derle.cmd

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: YamanPcCleaner-build
          path: YamanPcCleaner.exe
          if-no-files-found: error
          retention-days: 7
